<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현건슐랭 - 전국 맛집 지도 (카카오맵)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #002b49;
      --primary-light: #004d80;
      --accent: #e02424;
      --kakao-yellow: #fee500;
      --bg: #f8fafc;
      --sidebar-bg: #ffffff;
      --text-main: #191f28;
      --text-sub: #4e5968;
      --text-muted: #8b95a1;
      --border: #e5e8eb;
      --chip-bg: #f2f4f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }

    .app-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* Left Sidebar */
    .sidebar {
      width: 480px;
      min-width: 360px;
      height: 100%;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 4px 0 20px rgba(0,0,0,0.05);
      position: relative;
    }

    .header {
      background: linear-gradient(135deg, #00233b 0%, #004b7a 100%);
      color: white;
      padding: 24px 20px 20px;
      flex-shrink: 0;
    }
    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header p {
      margin-top: 4px;
      font-size: 12.5px;
      color: #d1d6db;
      line-height: 1.4;
    }

    /* Kakao Key Input Banner */
    .api-key-banner {
      background: #fefce8;
      border-bottom: 1px solid #fef08a;
      padding: 10px 16px;
      font-size: 12px;
      color: #713f12;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .api-key-banner input {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      font-size: 11.5px;
      outline: none;
    }
    .api-key-banner button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 11.5px;
      cursor: pointer;
      font-weight: 700;
    }

    /* Filter Controls */
    .filter-section {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .region-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .region-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 6px 13px;
      background: var(--chip-bg);
      border: 1px solid transparent;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { background: #e9ecef; color: var(--text-main); }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .search-row { display: flex; gap: 8px; }
    .search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box svg {
      position: absolute;
      left: 10px;
      width: 15px;
      height: 15px;
      stroke: var(--text-muted);
      fill: none;
    }
    .search-box input {
      width: 100%;
      padding: 8px 10px 8px 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12.5px;
      background: #fafafa;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--primary-light);
      background: #fff;
    }

    .status-bar {
      padding: 10px 18px;
      background: #fbfbfc;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .status-bar strong {
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
    }

    .card-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 80px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    .card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 43, 73, 0.08);
      border-color: #cbd5e1;
    }
    .card.selected {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 2px rgba(0, 77, 128, 0.25);
      background: #fcfdfd;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 6px;
    }
    .card-title {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-main);
    }
    .card-recommender {
      background: #e8f3fc;
      color: #0c66e4;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }
    .card-location {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-light);
      background: #f0f4f8;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .card-footer {
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .card-footer .menu-preview {
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-footer .more-btn {
      color: var(--primary);
      font-weight: 700;
    }

    /* Right Kakao Map */
    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
      background: #e5e5e5;
    }
    #map {
      height: 100%;
      width: 100%;
    }

    /* Kakao Custom Pin Marker */
    .k-pin {
      background: #002b49;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .k-pin:hover, .k-pin.active {
      background: #e02424;
      transform: scale(1.25);
    }

    /* Kakao Custom Popup Box */
    .k-popup {
      position: relative;
      bottom: 45px;
      border-radius: 12px;
      background: #fff;
      padding: 12px 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      min-width: 230px;
      max-width: 280px;
      font-family: 'Pretendard', sans-serif;
    }
    .k-popup::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #fff transparent;
      display: block;
      width: 0;
    }
    .k-popup-title {
      font-size: 15px;
      font-weight: 800;
      color: #002b49;
      margin-bottom: 2px;
    }
    .k-popup-sub {
      font-size: 11.5px;
      color: #8b95a1;
      margin-bottom: 8px;
    }
    .k-popup-menu {
      font-size: 12px;
      color: #4e5968;
      background: #f8fafc;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .k-popup-btn {
      width: 100%;
      background: #fee500;
      color: #191600;
      font-size: 11.5px;
      font-weight: 800;
      padding: 7px 0;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    /* Detail Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-panel {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    .modal-header {
      padding: 22px 22px 14px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .modal-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: #f1f3f5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: #495057;
    }
    .modal-title { font-size: 22px; font-weight: 800; color: var(--primary); }
    .modal-meta {
      margin-top: 4px;
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
    }
    .modal-meta span.author { color: #0c66e4; font-weight: 700; }
    .modal-body {
      padding: 18px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .info-block {
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
    }
    .info-block-label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .info-block-content { font-size: 13.5px; line-height: 1.55; color: var(--text-main); white-space: pre-wrap; }

    .map-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 14px 22px 20px;
      border-top: 1px solid var(--border);
      background: #fff;
    }
    .map-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }
    .btn-kakao { background-color: #fee500; color: #191600; }
    .btn-naver { background-color: #03c75a; color: #ffffff; }
    .btn-google { background-color: #1a73e8; color: #ffffff; }
  </style>
  <!-- Kakao Maps SDK with user's JavaScript Key -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5b64fcf65bb1ceaf33f89229033087d2"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="header">
        <div class="badge">🍽️ 2026 현대건설 사내 캠페인</div>
        <h1>현건슐랭 맛지도 (카카오맵)</h1>
        <p>카카오 지도 공식 API 연동 버전 (로컬 환경 지원)</p>
      </div>

      

      <!-- Controls -->
      <div class="filter-section">
        <div class="region-tabs" id="regionTabs">
          <button class="tab-btn active" data-region="전체">전체 (150)</button>
          <button class="tab-btn" data-region="서울">서울</button>
          <button class="tab-btn" data-region="경기·인천">경기·인천</button>
          <button class="tab-btn" data-region="충청·대전">충청·대전</button>
          <button class="tab-btn" data-region="강원">강원</button>
          <button class="tab-btn" data-region="영남">영남</button>
          <button class="tab-btn" data-region="호남">호남</button>
          <button class="tab-btn" data-region="제주">제주</button>
        </div>

        <div class="search-row">
          <div class="search-box">
            <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="inputName" placeholder="맛집명 검색 (예: 한서방, 태화루)">
          </div>
          <div class="search-box">
            <svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <input type="text" id="inputLoc" placeholder="시군구 검색 (예: 종로구, 해운대)">
          </div>
        </div>
      </div>

      <div class="status-bar">
        <div>식당 <strong id="resCount">0</strong>곳</div>
        <div>* 카드를 누르면 카카오맵 위치로 이동합니다</div>
      </div>

      <div class="card-list" id="cardList"></div>
    </aside>

    <!-- Right Kakao Map Container -->
    <main class="map-container">
      <div id="map"></div>
    </main>
  </div>

  <!-- Detail Modal Dialog -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-header">
        <button class="modal-close-btn" onclick="closeModal()" aria-label="닫기">&times;</button>
        <div class="modal-title" id="mName">식당명</div>
        <div class="modal-meta">
          <span id="mRegionLoc">지역 · 시군구</span>
          <span>•</span>
          <span>추천인: <span class="author" id="mAuthor">-</span></span>
        </div>
      </div>

      <div class="modal-body">
        <div class="info-block">
          <div class="info-block-label">📍 식당 위치 / 주소</div>
          <div class="info-block-content" id="mAddr">주소 정보</div>
        </div>
        <div class="info-block">
          <div class="info-block-label">⭐ 대표 추천 메뉴</div>
          <div class="info-block-content" id="mMenu">대표 메뉴</div>
        </div>
        <div class="info-block">
          <div class="info-block-label">💡 방문 팁 (웨이팅 / 주차 등)</div>
          <div class="info-block-content" id="mTips">방문 팁</div>
        </div>
        <div class="info-block">
          <div class="info-block-label">📝 식당과의 인연 & 추천 사유</div>
          <div class="info-block-content" id="mDesc">추천 상세</div>
        </div>
      </div>

      <div class="map-btn-group">
        <a id="btnKakao" target="_blank" class="map-btn btn-kakao">카카오맵</a>
        <a id="btnNaver" target="_blank" class="map-btn btn-naver">네이버지도</a>
        <a id="btnGoogle" target="_blank" class="map-btn btn-google">구글지도</a>
      </div>
    </div>
  </div>

  <script>

소함과 식감", "tips": "사장님이 친절하셔서 계란찜 더 달라고 해보세요, 방문전에 차 주차 말씀하시면 사장님이 주차게이트 열어주십니다.", "lat": 37.6605, "lng": 126.832315}, {"id": 62, "name": "우렁이박사", "region": "충청·대전", "sigungu": "당진시", "address": "충남 당진시 샛터로 7-1", "recommender": "문용기", "desc": "명절 귀성길/ 나들이에 가족·부모님 모시고 가기 좋은 ‘가족 맛집’ | 출장자/타지 손님 오면 무조건 데려가는 ‘손님 코스’\n고향이 충남이라 지역 주민 추천 받았습니다.", "menu": "우렁덕장, 우렁쌈장", "tips": "주차장은 잘되어있는거 같습니다. 서해 고속도로 이용하시면 잠시 들르기 좋습니다.", "lat": 36.895829, "lng": 126.629943}, {"id": 63, "name": "이이칸지 청라", "region": "경기·인천", "sigungu": "서해구", "address": "인천 서해구 청라커낼로 319번길 9, 1층", "recommender": "양영재", "desc": "눈치 안 보고 편하게 먹는 ‘혼밥/혼술 명당’\n하나드림타운 현장에 있을 때, 숙소 바로 앞에 있던 일식 돈카츠 집입니다. 숙소 앞에 있는 다른 돈카츠 집을 가려다가 재료 소진으로 못가고, 큰 기대없이 방문한 곳인데.. 오히려 제가 가려고 했던 돈카츠 집 보다 더 맛있어서 놀란 곳입니다! 알고보니 여기 사장님이 (돈카츠 좋아하는 분들이라면 한번쯤은 가보셨을) 카츠바이콘반에서 배우신 분이더라구요. 하나드림타운 현장에 있으면서 정말 여러번 방문한 또x10 간집!", "menu": "믹스(로스+히레) 카츠가 정말 맛있고, 색다른 맛을 찾으시면 미소카츠도 추천합니다. 아사히 생맥주를 비롯한 여러 주류를 팔기 때문에 함께 곁들이면 좋습니다!", "tips": "제가 처음 갔을 때만하더라도 크게 유명하지 않은 집이라서 이러다 망하는거 아닌가 걱정했는데.. 어느순간 입소문을 타고 사람이 많아져서 평일에도 웨이팅을 하는 식당이 되었습니다 ㅠㅠ.. 그래서 식사시간을 조금 피해서 가시면 웨이팅도 없고 갓튀긴 바삭한 돈카츠를 즐길 수 있습니다!", "lat": 37.452305, "lng": 126.703793}, {"id": 64, "name": "진양재순대 삼성", "region": "서울", "sigungu": "서울특별시", "address": "서울특별시 강남구 봉은사로114길 38 1층", "recommender": "김태영", "desc": "고된 하루 끝, 동료들과 땀 흘리고 마시는 ‘퇴근 후 회식’ | 바쁜 일정 속 빠르고 든든하게 먹는 ‘파워 점심’\nGBC, 공공기여 현장 근처", "menu": "순대국밥, 철판볶음", "tips": "점심은 11시 30분 이후에 가면 웨이팅 상당함, 저녁에는 웨이팅 없음", "lat": 37.513356, "lng": 127.050733}, {"id": 65, "name": "장영선원조지례삼거리불고기", "region": "영남", "sigungu": "김천시", "address": "경북 김천시 지례면 장터길 64", "recommender": "윤기주", "desc": "고된 하루 끝, 동료들과 땀 흘리고 마시는 ‘퇴근 후 회식’ | 명절 귀성길/ 나들이에 가족·부모님 모시고 가기 좋은 ‘가족 맛집’\n김천 사는 친구 집으로 놀러 갔었다가 김천의 맛집으로 소개 받아 친구랑 같이 저녁으로 먹었던 곳입니다.", "menu": "이 곳에서 꼭 먹어야 하는 대표 추천 메뉴는 양념불고기 입니다. 옛날 노포 느낌의 맛집으로 연탄불에 석쇠 위에 구워먹는 양념불고기는 한번도 안 먹어본 사람은 있어도 한번만 먹어본 사람은 없을 정도로 진한 불맛이 일품입니다. 식사로 같이 주문 가능한 보리밥에 같이 나오는 반찬들과 열무김치, 참기름 살짝 넣어 비벼 먹으면 즉석에서 만들어지는 꽁보리 비빔밥이 완성되며, 양념불고기와 궁합이 아주 잘 맞습니다.", "tips": "주말보다는 평일에 방문하거나 명절 연휴 중 방문드리는 걸 추천드리며, 차를 끌고 와야 하기 때문에 술을 드신다고 하면은 대리기사 필수입니다. 캐치테이블 같은 웨이팅 어플이 없어서 방문 전에 전화로 확인하는 걸 추천드리며 현장 웨이팅이 있는 경우 30분 정도는 예상하고 가셔야 합니다. 식당에서 직접 운영하는 주차장은 없고, 인근 공터에  주차 가능한 곳들이 있으니 주변 주차터를 확인하시는 것이 좋습니다.", "lat": 36.14283, "lng": 128.116253}, {"id": 66, "name": "만복순대국", "region": "경기·인천", "sigungu": "안양시", "address": "경기도 안양시 만안구 양화로 159", "recommender": "변준식", "desc": "바쁜 일정 속 빠르고 든든하게 먹는 ‘파워 점심’ | 전날 마신 술이 싹 내려가는 ‘해장 종결지’\n부대 근처", "menu": "순대국", "tips": "주차 안됩니다.", "lat": 37.39276, "lng": 126.953263}, {"id": 67, "name": "카페 툇마루", "region": "강원", "sigungu": "강릉시", "address": "(도로명) 강원 강릉시 난설헌로 232 카페 툇마루 / (지번) 강원 강릉시 초당동 355", "recommender": "박종식", "desc": "든든한 식사 후 달콤한 커피 한잔의 여유~\n데이트코스로 처음 방문하고 맛에 반해서 가족여행코스로 발전한 커피맛집", "menu": "대표메뉴 : 툇마루커피", "tips": "웨이팅 순번표 받고, 근처 산책코스 (허균/허난설헌기념공원, 경포아쿠아리움, 아르떼뮤지엄강릉 등) 방문하면 웨이팅 시간이 지루하지 않음", "lat": 37.754924, "lng": 128.879676}, {"id": 68, "name": "부성민물매운", "region": "충청·대전", "sigungu": "천안시", "address": "충남 천안시 서북구 2공단1로 34 부성민물매운탕", "recommender": "오치원", "desc": "어죽 입문자부터 경험자까지 모두 만족 시킬 수 있는 '전국구 어죽 맛집'\n업체 출장으로 천안을 방문 했을 당시, 업체 담당자분이 자신있게 어죽 맛집이라고 추천하여 방문하게 되었습니다.", "menu": "새우어죽 추천 ! 인삼 향을 좋아하는 사람이라면 별미로 인삼어죽 ! 그리고 업체 분 말로는 송어회 맛집이라고 합니다.", "tips": "평일/ 주말 점심 피크 시간대만 피해주시면 괜찮을거 같습니다. ( 주차 공간이 협소합니다. ㅜ )", "lat": 36.811785, "lng": 127.113788}, {"id": 69, "name": "해초 양산본점", "region": "영남", "sigungu": "양산시", "address": "경남 양산시 삼성3길 17-12 1층", "recommender": "김서연", "desc": "출장자/타지 손님 오면 무조건 데려가는 ‘손님 코스’\n이곳은 제 본가에 계신 부모님 맛집입니다. 쉬는날 내려갈때 매다 부모님이랑 꼭 먹으러 가는 물회집입니다.", "menu": "저는 무조건 참가자미+광어 물회를 먹는데요, 오징어도 좋아해서 한치+갑오징어 물회도 강력추천 드립니다~! 그리고 이곳은 나주배 육수를 주는데 이 육수가 진짜 달큰하고 맛있어요~! 냉장고 가득 나주배가 가득한 곳이랍니다. 또 배를 채썰어서 가득 넣어주세요. 물회만 시켜도 매운탕 무조건 기본에 기본찬도 정말 깔끔하고 맛있습니다.", "tips": "당연히 건물 내 지상에 주차장이 있구요~! 여름 성수기엔 항상 점심전부터 사람이 많이 있습니다. 살짝 식사시간대 지나가시면 좋고, 메뉴 자체가 차가운 음식이다 보니 회전율은 좋아서 빨리 자리가 나니 웨이팅은 기다리실만 합니다~! 강추드립니다.", "lat": 35.331554, "lng": 129.039385}, {"id": 70, "name": "한영식당", "region": "서울", "sigungu": "대전광역시",     };

    function getFilteredData() {
      return DATA.filter(item => {
        const matchRegion = selectedRegion === "전체" || item.region === selectedRegion;
        const matchName = !searchName || item.name.toLowerCase().includes(searchName.toLowerCase());
        const matchLoc = !searchLoc || (item.region + " " + item.sigungu + " " + item.address).toLowerCase().includes(searchLoc.toLowerCase());
        return matchRegion && matchName && matchLoc;
      });
    }

    function renderCardsAndMarkers() {
      const cardList = document.getElementById("cardList");
      const resCount = document.getElementById("resCount");
      cardList.innerHTML = "";

      // Clear existing overlays
      overlays.forEach(o => o.setMap(null));
      overlays = [];
      if (activePopupOverlay) {
        activePopupOverlay.setMap(null);
        activePopupOverlay = null;
      }

      const filtered = getFilteredData();
      resCount.innerText = filtered.length;

      filtered.forEach((item, idx) => {
        // 1. Sidebar Card
        const card = document.createElement("div");
        card.className = "card" + (item.id === selectedId ? " selected" : "");
        card.id = `card-${item.id}`;
        card.onclick = () => selectItem(item, true);

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${item.name}</span>
            <span class="card-recommender">${item.recommender} 추천</span>
          </div>
          <div class="card-location">${item.region} · ${item.sigungu || item.address.split(' ')[0]}</div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-footer">
            <span class="menu-preview">⭐ ${item.menu}</span>
            <span class="more-btn">상세보기 &rarr;</span>
          </div>
        `;
        cardList.appendChild(card);

        // 2. Kakao Custom Overlay Pin Marker
        if (map && kakao && kakao.maps) {
          const pos = new kakao.maps.LatLng(item.lat, item.lng);

          const pinDiv = document.createElement('div');
          pinDiv.className = 'k-pin' + (item.id === selectedId ? ' active' : '');
          pinDiv.id = `k-pin-${item.id}`;
          pinDiv.innerText = idx + 1;

          pinDiv.onclick = () => {
            selectItem(item, false);
            showPopup(item);
          };

          const customOverlay = new kakao.maps.CustomOverlay({
            position: pos,
            content: pinDiv,
            yAnchor: 0.5
          });

          customOverlay.setMap(map);
          overlays.push(customOverlay);
        }
      });

      if (map && kakao && kakao.maps && regionCenters[selectedRegion]) {
        const rc = regionCenters[selectedRegion];
        map.setLevel(rc.level);
        map.panTo(new kakao.maps.LatLng(rc.lat, rc.lng));
      }
    }

    function showPopup(item) {
      if (activePopupOverlay) {
        activePopupOverlay.setMap(null);
      }

      const popupDiv = document.createElement('div');
      popupDiv.className = 'k-popup';
      popupDiv.innerHTML = `
        <div class="k-popup-title">${item.name}</div>
        <div class="k-popup-sub">${item.region} · ${item.sigungu} (추천: ${item.recommender})</div>
        <div class="k-popup-menu"><strong>메뉴:</strong> ${item.menu}</div>
        <button class="k-popup-btn" onclick="openModalById(${item.id})">상세정보 & 길찾기</button>
      `;

      activePopupOverlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(item.lat, item.lng),
        content: popupDiv,
        yAnchor: 1.2
      });

      activePopupOverlay.setMap(map);
    }

    function selectItem(item, openPopup) {
      selectedId = item.id;

      document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
      const targetCard = document.getElementById(`card-${item.id}`);
      if (targetCard) {
        targetCard.classList.add("selected");
        targetCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      document.querySelectorAll(".k-pin").forEach(p => p.classList.remove("active"));
      const targetPin = document.getElementById(`k-pin-${item.id}`);
      if (targetPin) targetPin.classList.add("active");

      if (map && kakao && kakao.maps) {
        map.panTo(new kakao.maps.LatLng(item.lat, item.lng));
        if (openPopup) {
          showPopup(item);
        }
      }
    }

    function openModalById(id) {
      const item = DATA.find(d => d.id === id);
      if (item) openModal(item);
    }

    function openModal(item) {
      document.getElementById("mName").innerText = item.name;
      document.getElementById("mRegionLoc").innerText = `${item.region} · ${item.sigungu}`;
      document.getElementById("mAuthor").innerText = item.recommender;
      document.getElementById("mAddr").innerText = item.address;
      document.getElementById("mMenu").innerText = item.menu;
      document.getElementById("mTips").innerText = item.tips;
      document.getElementById("mDesc").innerText = item.desc;

      const q = encodeURIComponent(`${item.name} ${item.sigungu}`);
      document.getElementById("btnKakao").href = `https://map.kakao.com/link/search/${q}`;
      document.getElementById("btnNaver").href = `https://map.naver.com/v5/search/${q}`;
      document.getElementById("btnGoogle").href = `https://www.google.com/maps/search/?api=1&query=${q}`;

      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
      if (activePopupOverlay) {
        activePopupOverlay.setMap(null);
        activePopupOverlay = null;
      }
    }

    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedRegion = btn.dataset.region;
        selectedId = null;
        renderCardsAndMarkers();
      });
    });

    document.getElementById("inputName").addEventListener("input", (e) => {
      searchName = e.target.value.trim();
      renderCardsAndMarkers();
    });

    document.getElementById("inputLoc").addEventListener("input", (e) => {
      searchLoc = e.target.value.trim();
      renderCardsAndMarkers();
    });
  </script>
</body>
</html>
