<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현대식(食) 맛지도 | 현대건설 임직원이 직접 검증한 전국 맛집</title>
<meta name="description" content="현대건설 임직원이 직접 검증한 전국 맛집 150곳을 지도에서 찾아보세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#16201b; --sub:#4d5a53; --mute:#8b948f;
  --green:#0b6b47; --green-d:#084d34; --green-t:#e3efe9;
  --sun:#ffc20e; --paper:#f1f4f2; --card:#fff; --line:#d8dfdb;
  --panel:420px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;height:100dvh;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* header */
header{background:var(--green);color:#fff;padding:14px 24px 15px;border-bottom:4px solid var(--sun);flex:none}
header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
header p{margin:3px 0 0;font-size:14px;font-weight:500;color:#cfe5da}

main{flex:1;min-height:0;display:grid;grid-template-columns:var(--panel) 1fr}

/* left panel */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--paper);border-right:1px solid var(--line)}
.filters{flex:none;padding:14px 16px 12px;background:#fff;border-bottom:1px solid var(--line)}
.flabel{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 7px}
.regions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--sub);transition:background .15s,color .15s,border-color .15s}
.chip b{font-weight:600;color:var(--mute);margin-left:4px;font-size:12px}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.chip[aria-pressed=true] b{color:#bfe0d0}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 11px 9px;display:flex;flex-direction:column;gap:2px;position:relative;transition:border-color .15s,background .15s}
.cat span{font-size:14px;font-weight:700;letter-spacing:-.02em}
.cat em{font-style:normal;font-size:12px;color:var(--mute);font-weight:600}
.cat:hover{border-color:var(--green)}
.cat[aria-pressed=true]{background:var(--green-t);border-color:var(--green);box-shadow:inset 0 -4px 0 var(--sun)}
.cat[aria-pressed=true] span{color:var(--green-d)}
.cats{margin-bottom:14px}
.search-box{position:relative;display:flex;align-items:center}
.search-box svg{position:absolute;left:12px;width:16px;height:16px;fill:var(--mute);pointer-events:none}
.search-input{width:100%;padding:10px 36px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#f8faf9;color:var(--ink);transition:border-color .15s,background .15s}
.search-input::placeholder{color:var(--mute)}
.search-input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px var(--green-t)}
.search-clear{position:absolute;right:6px;background:none;border:0;color:var(--mute);font-size:15px;padding:6px 9px;display:none}
.search-clear:hover{color:var(--ink)}
.meta{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 18px 6px;font-size:13px;color:var(--sub);font-weight:600}
.meta button{border:0;background:none;color:var(--green);font-weight:700;font-size:13px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.list{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 28px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}

/* card */
.card{flex:none;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.card.open{border-color:var(--green);box-shadow:-4px 0 0 var(--sun)}
.head{width:100%;text-align:left;background:none;border:0;padding:12px 14px;display:block}
.head:hover{background:#f8faf9}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nm{font-size:16px;font-weight:800;letter-spacing:-.025em}
.loc{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
.sig{margin:3px 0 0;font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.sig-lbl{display:none}
.card.open .sig-lbl{display:block;margin:8px 0 2px;font-size:12px;font-weight:700;color:var(--green)}
.card.open .sig{-webkit-line-clamp:unset;display:block}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-size:11.5px;font-weight:700;color:var(--green-d);background:var(--green-t);border-radius:4px;padding:2px 7px}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.card.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}
.detail{padding:2px 14px 14px;border-top:1px dashed var(--line);margin:0 0 0}
.detail dl{margin:10px 0 0}
.detail dt{font-size:12px;font-weight:700;color:var(--green);margin:11px 0 2px}
.detail dd{margin:0;font-size:14px;line-height:1.6;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;margin-top:14px}
.acts a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:700;padding:9px 8px;border-radius:6px;border:1px solid var(--green);color:var(--green)}
.acts a.pri{background:var(--green);color:#fff}
.acts a:hover{background:var(--green-d);color:#fff;border-color:var(--green-d)}
.by{margin:12px 0 0;font-size:12.5px;color:var(--mute)}
.empty{margin:40px 10px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
.empty button{margin-top:8px;border:1px solid var(--green);background:#fff;color:var(--green);font-weight:700;border-radius:6px;padding:8px 14px}

/* header button + suggest dialog */
header{display:flex;align-items:center;justify-content:space-between;gap:14px}
.suggest-btn{flex:none;background:var(--sun);color:#1a1400;border:0;border-radius:8px;padding:10px 16px;font-weight:800;font-size:14px;letter-spacing:-.02em;box-shadow:0 1px 0 rgba(0,0,0,.2);transition:transform .1s,background .15s}
.suggest-btn:hover{background:#ffd23f}
.suggest-btn:active{transform:translateY(1px)}
.suggest-btn .short{display:none}
.dlg{border:0;border-radius:12px;padding:0;width:min(560px,94vw);max-height:92dvh;color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlg::backdrop{background:rgba(10,25,18,.55)}
.dlg-body{padding:22px 24px 24px}
.dlg h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.03em}
.dlg .lead{margin:0 0 18px;font-size:13.5px;color:var(--sub)}
.dlg-x{position:absolute;right:10px;top:10px;border:0;background:none;font-size:18px;color:var(--mute);padding:8px 10px;border-radius:6px}
.dlg-x:hover{color:var(--ink);background:var(--paper)}
.fld{margin:0 0 14px}
.fld>label,.fld>.lbl{display:block;font-size:13px;font-weight:700;margin:0 0 5px}
.fld .req{color:#c0392b;margin-left:2px}
.fld .hint{font-weight:500;color:var(--mute);font-size:12px;margin-left:6px}
.fld input[type=text],.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;background:#f8faf9;color:var(--ink)}
.fld textarea{min-height:68px;resize:vertical;line-height:1.5}
.fld input[type=text]:focus,.fld textarea:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px var(--green-t)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--sub)}
.opt input:checked+span{background:var(--green);border-color:var(--green);color:#fff}
.opt input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.sg-msg{margin:0 0 12px;font-size:13px;font-weight:600;color:#a93226}
.sg-msg:empty{display:none}
.cta{width:100%;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:800;font-size:16px;padding:13px;letter-spacing:-.02em}
.cta:hover{background:var(--green-d)}
.cta:disabled{opacity:.6;cursor:wait}
.sg-done{text-align:center;padding:28px 8px 6px}
.sg-done b{display:block;font-size:19px;margin-bottom:8px}
.sg-done p{margin:0 0 20px;color:var(--sub);font-size:14px;line-height:1.6}

.stale{margin:0;padding:8px 18px;background:#fff7e0;color:#5b4500;font-size:12.5px;font-weight:600;line-height:1.5;border-bottom:1px solid var(--sun);word-break:break-all}
.stale[hidden]{display:none}

/* map */
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#e6ebe8}
.note{position:absolute;z-index:5;left:50%;top:14px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--sub);box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:90%;text-align:center}
.note.err{background:#fff7e0;border-color:var(--sun);color:#5b4500;border-radius:10px}
.note[hidden]{display:none}

/* map pins (restaurant name) */
.pin{position:relative;transform:translateY(-8px);cursor:pointer;display:flex;flex-direction:column;align-items:center}
.pin span{background:var(--green);color:#fff;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:5px;white-space:nowrap;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);letter-spacing:-.02em}
.pin i{width:0;height:0;border:6px solid transparent;border-top-color:var(--green);border-bottom:0;margin-top:-1px}
.pin.sel span{background:var(--sun);color:#1a1400;border-color:#1a1400;font-size:13.5px}
.pin.sel i{border-top-color:#1a1400}
.far .pin:not(.sel) span{font-size:0;padding:0;width:11px;height:11px;border-radius:50%;border-width:2px}
.far .pin:not(.sel) i{display:none}
.far .pin:not(.sel):hover span{font-size:12.5px;padding:4px 9px;width:auto;height:auto;border-radius:5px;border-width:1.5px}

@media (max-width:820px){
  header{padding:11px 16px 12px}
  header h1{font-size:21px}
  .suggest-btn{padding:9px 12px;font-size:13px}
  .suggest-btn .long{display:none}
  .suggest-btn .short{display:inline}
  .dlg-body{padding:20px 18px 20px}
  header p{font-size:12.5px}
  main{grid-template-columns:1fr;grid-template-rows:38% 1fr}
  .mapwrap{order:-1}
  .panel{border-right:0;border-top:1px solid var(--line);overflow-y:auto}
  .list{flex:none;overflow:visible}
  .cats{grid-template-columns:repeat(3,1fr);gap:6px}
  .cat{padding:8px 9px 7px}
  .cat span{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.more,.list{transition:none;scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>현대식(食) 맛지도</h1>
    <p>현대건설 임직원이 직접 검증한 전국 맛집</p>
  </div>
  <button type="button" id="suggest-open" class="suggest-btn"><span class="long">나만의 맛집 추천하기</span><span class="short">맛집 추천</span></button>
</header>
<main>
  <section class="panel" aria-label="맛집 목록">
    <div class="filters">
      <p class="flabel">지역</p>
      <div class="regions" id="regions"></div>
      <p class="flabel">추천 순간</p>
      <div class="cats" id="cats"></div>
      <p class="flabel">검색</p>
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="search" id="query" class="search-input" placeholder="식당명, 메뉴, 지역, 추천 순간으로 검색" autocomplete="off" aria-label="맛집 검색">
        <button type="button" id="search-clear" class="search-clear" aria-label="검색어 지우기">✕</button>
      </div>
    </div>
    <p class="stale" id="stale" hidden></p>
    <div class="meta"><span id="count"></span><button id="reset" type="button" hidden>필터 해제</button></div>
    <div class="list" id="list"></div>
  </section>
  <section class="mapwrap" aria-label="지도">
    <div id="map"></div>
    <div class="note" id="note" hidden></div>
  </section>
</main>

<dialog id="suggest-dlg" class="dlg" aria-labelledby="sg-title">
  <div class="dlg-body">
    <button type="button" class="dlg-x" id="sg-close" aria-label="닫기">✕</button>
    <div id="sg-form-wrap">
      <h2 id="sg-title">나만의 맛집 추천하기</h2>
      <p class="lead">동료들에게 알려주고 싶은 맛집을 남겨 주세요. 확인 후 지도에 반영합니다.</p>
      <form id="sg-form" novalidate>
        <div class="fld"><label for="sg-by">추천인<span class="req">*</span><span class="hint">사이트에는 '김*형'처럼 가려서 표시돼요</span></label>
          <input type="text" id="sg-by" maxlength="40" required autocomplete="name"></div>
        <div class="fld"><label for="sg-name">식당 이름<span class="req">*</span></label>
          <input type="text" id="sg-name" maxlength="80" required></div>
        <div class="fld"><label for="sg-addr">식당 위치<span class="req">*</span><span class="hint">주소 또는 동네까지 알려 주세요</span></label>
          <input type="text" id="sg-addr" maxlength="200" required placeholder="예: 서울 종로구 북촌로5길 78"></div>
        <div class="fld"><label for="sg-menu">대표/추천 메뉴<span class="req">*</span></label>
          <input type="text" id="sg-menu" maxlength="500" required></div>
        <div class="fld"><label for="sg-story">식당과의 인연</label>
          <textarea id="sg-story" maxlength="1000"></textarea></div>
        <div class="fld"><label for="sg-tip">방문 팁</label>
          <textarea id="sg-tip" maxlength="1000" placeholder="웨이팅, 주차, 브레이크 타임 등"></textarea></div>
        <div class="fld"><span class="lbl">추천 순간<span class="hint">여러 개 선택할 수 있어요</span></span>
          <div class="opts" id="sg-cats"></div>
          <input type="text" id="sg-etc" maxlength="200" placeholder="기타 (직접 작성)" aria-label="추천 순간 기타"></div>
        <div class="hp" aria-hidden="true"><label>website<input type="text" id="sg-hp" tabindex="-1" autocomplete="off"></label></div>
        <p class="sg-msg" id="sg-msg" role="alert"></p>
        <button type="submit" class="cta" id="sg-submit">추천하기</button>
      </form>
    </div>
    <div id="sg-done" class="sg-done" hidden>
      <b>추천이 접수되었어요 🙌</b>
      <p>소중한 맛집 정보 감사합니다.<br>확인 후 지도에 반영할게요.</p>
      <button type="button" class="cta" id="sg-done-close">닫기</button>
    </div>
  </div>
</dialog>

<script>
/* ▼ 카카오 개발자 콘솔에서 발급받은 JavaScript 키를 넣어주세요 (플랫폼에 사이트 도메인 등록 필요) */
const KAKAO_KEY = "5b64fcf65bb1ceaf33f89229033087d2";

/* ▼ Cloudflare Worker 주소 (배포 후 받은 주소 + /api/restaurants). 비워두면 아래 내장 데이터를 사용합니다 */
const API_URL = "https://food-api.hdec-nicetaste.workers.dev/api/restaurants";

let DATA = [];      // Cloudflare D1에서 불러옵니다
const REGIONS = ["서울","경기·인천","충청·대전","강원","영남","호남","제주"];
const SUGGEST_URL = API_URL.replace(/\/api\/restaurants$/, "/api/suggest");
const CATS = ["가족 맛집","회식 추천","손님 코스","혼밥 명당","파워 점심","해장 종결지"];
const CACHE_KEY = "hdec-food-geo-v4";
const DATA_CACHE = "hdec-food-data-v1";  // 마지막으로 불러온 맛집 목록(네트워크 오류 대비)
const gk = d => d.n + "|" + d.a;  // 좌표 저장 키(엑셀 순서가 바뀌어도 유지)

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { region:null, cat:null, open:null, query:"" };
let loadError = false, loadErrorMsg = "";
let map = null, geo = {}, byId = {};
DATA.forEach(d => byId[d.id] = d);
try { geo = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); } catch(e){ geo = {}; }

/* ---------- filters ---------- */
const okRegion = d => !state.region || d.r === state.region;
const okCat = d => !state.cat || d.c.includes(state.cat);
// 검색어는 공백으로 나눠 모두 포함된 식당만 (예: "서울 회식 국밥"). 추천인은 검색 대상에서 제외
const okQuery = d => {
  const toks = state.query.toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return true;
  const hay = [d.n, d.m, d.a, d.r, d.b, d.t, d.x, d.c.join(" ")].join(" ").toLowerCase();
  return toks.every(k => hay.includes(k));
};
function visibleItems(){ return DATA.filter(d => okRegion(d) && okCat(d) && okQuery(d)); }
function resetAll(){
  state.region = state.cat = null; state.query = "";
  $("query").value = ""; $("search-clear").style.display = "none";
  refresh(true);
}
function renderFilters(){
  const regionBase = DATA.filter(d => okCat(d) && okQuery(d));
  const catBase = DATA.filter(d => okRegion(d) && okQuery(d));
  $("regions").innerHTML =
    `<button class="chip" type="button" data-r="" aria-pressed="${!state.region}">전체<b>${regionBase.length}</b></button>` +
    REGIONS.map(r => `<button class="chip" type="button" data-r="${r}" aria-pressed="${state.region===r}">${r}<b>${regionBase.filter(d=>d.r===r).length}</b></button>`).join("");
  $("cats").innerHTML = CATS.map(c =>
    `<button class="cat" type="button" data-c="${c}" aria-pressed="${state.cat===c}"><span>${c}</span><em>${catBase.filter(d=>d.c.includes(c)).length}곳</em></button>`).join("");
}
function shortLoc(a){ return a.split(/\s+/).slice(0,2).join(" "); }  // 지도 검색용
const PROV = [[/^서울/,"서울"],[/^부산/,"부산"],[/^대구/,"대구"],[/^인천/,"인천"],[/^광주(?!시)/,"광주"],[/^대전/,"대전"],[/^울산/,"울산"],[/^세종/,"세종"],
  [/^경기/,"경기"],[/^강원/,"강원"],[/^(충북|충청북도)/,"충북"],[/^(충남|충청남도)/,"충남"],[/^(전북|전라북도)/,"전북"],[/^(전남|전라남도)/,"전남"],
  [/^(경북|경상북도)/,"경북"],[/^(경남|경상남도)/,"경남"],[/^제주(?!시)/,"제주"]];
// 카드에 보이는 위치: "서울 강남구", "제주 제주시"처럼 시도 + 시·군·구까지만
function locLabel(d){
  const t = d.a.replace(/^\([^)]*\)\s*/, "").trim().split(/\s+/);
  let prov = "", i = 0;
  for (const [re, name] of PROV){ if (re.test(t[0])){ prov = name; i = 1; break; } }
  if (prov === "세종") return "세종";
  const gu = t.slice(i, i + 2).find(x => /(시|군|구)$/.test(x)) || "";
  if (!prov && gu) prov = ({"서울":"서울","강원":"강원","제주":"제주"})[d.r] || "";
  return [prov, gu].filter(Boolean).join(" ") || t.slice(0, 2).join(" ");
}
// 추천인 표기: 김준형 -> 김*형 (이미 가려진 값은 그대로)
function maskName(n){
  n = (n || "").trim();
  if (!n || n.includes("*") || n.length < 2) return n;
  return n.length === 2 ? n[0] + "*" : n[0] + "*".repeat(n.length - 2) + n[n.length - 1];
}

function cardHTML(d){
  const open = state.open === d.id;
  const q = encodeURIComponent(d.n);
  const g = geo[gk(d)];
  const kakao = g ? `https://map.kakao.com/link/to/${q},${g.lat},${g.lng}` : `https://map.kakao.com/?q=${encodeURIComponent(d.a)}`;
  const naver = `https://map.naver.com/p/search/${encodeURIComponent(d.a + " " + d.n)}`;
  const row = (k,v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
  return `<article class="card${open?" open":""}" data-id="${d.id}">
    <button class="head" type="button" aria-expanded="${open}" aria-controls="m${d.id}">
      <div class="row1"><span class="nm">${esc(d.n)}</span><span class="loc">${esc(locLabel(d))}</span></div>
      <span class="sig-lbl">대표/추천 메뉴</span>
      <p class="sig">${esc(d.m)}</p>
      ${d.c.length ? `<div class="tags">${d.c.map(c=>`<span class="tag">${c}</span>`).join("")}</div>` : ""}
    </button>
    <div class="more" id="m${d.id}"><div><div class="detail"><dl>
      ${row("식당과의 인연", d.b)}
      ${row("방문 팁", d.t)}
      ${row("이럴 때 추천", d.x)}
      ${row("주소", d.a)}
    </dl>
    <div class="acts"><a class="pri" href="${kakao}" target="_blank" rel="noopener">카카오맵 길찾기</a><a href="${naver}" target="_blank" rel="noopener">네이버지도</a></div>
    <p class="by">${esc(maskName(d.p))}</p></div></div></div>
  </article>`;
}
function renderList(){
  const items = visibleItems();
  $("count").textContent = `맛집 ${items.length}곳`;
  $("reset").hidden = !(state.region || state.cat || state.query);
  $("list").innerHTML = items.length ? items.map(cardHTML).join("") :
    (loadError
      ? `<div class="empty">맛집 데이터를 불러오지 못했어요.<br>잠시 후 다시 시도해 주세요.<br><button type="button" id="retry">다시 시도</button><br><small style="display:block;margin-top:14px;color:#8b948f;word-break:break-all">원인: ${esc(loadErrorMsg)}<br>${esc(API_URL)}</small></div>`
      : `<div class="empty">조건에 맞는 맛집이 없어요.<br>검색어나 필터를 바꿔 보세요.<br><button type="button" id="empty-reset">전체 초기화</button></div>`);
}

/* ---------- map ---------- */
const overlays = {};
function makePin(d){
  const g = geo[gk(d)];
  if (!g || overlays[d.id]) return;
  const el = document.createElement("div");
  el.className = "pin" + (state.open === d.id ? " sel" : "");
  el.innerHTML = `<span>${esc(d.n)}</span><i></i>`;
  el.addEventListener("click", () => select(d.id, {fromMap:true}));
  overlays[d.id] = { el, ov: new kakao.maps.CustomOverlay({ position:new kakao.maps.LatLng(g.lat,g.lng), content:el, yAnchor:1, zIndex:1 }) };
}
function syncMap(fit){
  if (!map) return;
  const vis = new Set(visibleItems().map(d => d.id));
  const bounds = new kakao.maps.LatLngBounds();
  let n = 0;
  DATA.forEach(d => {
    makePin(d);
    const o = overlays[d.id];
    if (!o) return;
    const show = vis.has(d.id);
    o.ov.setMap(show ? map : null);
    if (show){ bounds.extend(new kakao.maps.LatLng(geo[gk(d)].lat, geo[gk(d)].lng)); n++; }
  });
  if (fit && n){
    if (n === 1){ map.setLevel(4); map.setCenter(bounds.getSouthWest()); }
    else map.setBounds(bounds, 70, 70, 70, 70);
  }
}
function select(id, opt={}){
  const was = state.open;
  state.open = (was === id && !opt.fromMap) ? null : id;
  renderList();
  Object.entries(overlays).forEach(([k,o]) => { o.el.classList.toggle("sel", +k === state.open); o.ov.setZIndex(+k === state.open ? 10 : 1); });
  if (state.open){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.scrollIntoView({block:"nearest"});
    const g = geo[gk(byId[id])];
    if (map && g){ if (map.getLevel() > 5) map.setLevel(4); map.panTo(new kakao.maps.LatLng(g.lat, g.lng)); }
  }
}

/* ---------- geocoding (카카오 주소 → 좌표, 결과는 브라우저에 저장) ---------- */
function cleanAddr(a){
  a = a.replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
  const t = a.split(" ");
  for (let i=1;i<t.length;i++){
    if (/^\d+(-\d+)?$/.test(t[i]) && /(로|길)\d*[가-힣]*$/.test(t[i-1])) return t.slice(0,i+1).join(" ");
  }
  return a;
}
function geocodeOne(d, gc, ps){
  const tries = [d.q || d.a, cleanAddr(d.q || d.a)];
  return new Promise(resolve => {
    let i = 0;
    const next = () => {
      if (i < tries.length){
        const q = tries[i++];
        gc.addressSearch(q, (r, s) => (s === kakao.maps.services.Status.OK && r[0]) ? resolve({lat:+r[0].y, lng:+r[0].x}) : next());
      } else {
        ps.keywordSearch(`${shortLoc(d.q || d.a)} ${d.n}`, (r, s) => resolve((s === kakao.maps.services.Status.OK && r[0]) ? {lat:+r[0].y, lng:+r[0].x} : null));
      }
    };
    next();
  });
}
async function geocodeAll(){
  const gc = new kakao.maps.services.Geocoder(), ps = new kakao.maps.services.Places();
  const todo = DATA.filter(d => !geo[gk(d)]);
  const failed = [];
  let done = 0;
  for (const d of todo){
    $("note").hidden = false; $("note").textContent = `맛집 위치를 불러오는 중… ${done}/${todo.length}`;
    const g = await geocodeOne(d, gc, ps);
    done++;
    if (g){ geo[gk(d)] = g; } else failed.push(d.n);
    if (done % 10 === 0 || done === todo.length){
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(geo)); } catch(e){}
      syncMap(false);
    }
    await new Promise(r => setTimeout(r, 60));
  }
  syncMap(true);
  if (failed.length){
    $("note").className = "note err";
    $("note").textContent = `위치를 찾지 못한 맛집 ${failed.length}곳: ${failed.slice(0,4).join(", ")}${failed.length>4?" 외":""}`;
    console.warn("지오코딩 실패:", failed);
  } else $("note").hidden = true;
}

function initMap(){
  map = new kakao.maps.Map($("map"), { center:new kakao.maps.LatLng(36.4, 127.9), level:12 });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  kakao.maps.event.addListener(map, "zoom_changed", () => $("map").classList.toggle("far", map.getLevel() >= 10));
  $("map").classList.toggle("far", map.getLevel() >= 10);
  syncMap(true);
  geocodeAll();
}
function loadKakao(){
  if (!KAKAO_KEY || KAKAO_KEY.startsWith("여기에")){
    $("note").hidden = false; $("note").className = "note err";
    $("note").textContent = "지도를 보려면 코드 상단 KAKAO_KEY에 카카오 JavaScript 키를 넣어주세요.";
    return;
  }
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&libraries=services&autoload=false`;
  s.onload = () => kakao.maps.load(initMap);
  s.onerror = () => { $("note").hidden = false; $("note").className = "note err"; $("note").textContent = "카카오 지도를 불러오지 못했어요. 키와 사이트 도메인 등록을 확인해 주세요."; };
  document.head.appendChild(s);
}

/* ---------- events ---------- */
function refresh(fit){
  if (state.open && !visibleItems().some(d => d.id === state.open)) state.open = null;
  renderFilters(); renderList(); syncMap(fit);
}
$("regions").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.region = b.dataset.r || null; refresh(true);
});
$("cats").addEventListener("click", e => {
  const b = e.target.closest(".cat"); if (!b) return;
  state.cat = state.cat === b.dataset.c ? null : b.dataset.c; refresh(true);
});
$("reset").addEventListener("click", resetAll);
let fitTimer;
$("query").addEventListener("input", e => {
  state.query = e.target.value;
  $("search-clear").style.display = state.query ? "block" : "none";
  refresh(false);
  clearTimeout(fitTimer); fitTimer = setTimeout(() => syncMap(true), 350);  // 입력이 멈추면 결과에 맞게 지도 이동
});
$("query").addEventListener("keydown", e => { if (e.key === "Escape" && state.query) resetQueryOnly(); });
$("search-clear").addEventListener("click", () => { resetQueryOnly(); $("query").focus(); });
function resetQueryOnly(){ state.query = ""; $("query").value = ""; $("search-clear").style.display = "none"; refresh(true); }
$("list").addEventListener("click", e => {
  if (e.target.id === "empty-reset"){ resetAll(); return; }
  if (e.target.id === "retry"){ boot(); return; }
  const h = e.target.closest(".head"); if (h) select(+h.closest(".card").dataset.id);
});

function setData(rows){
  DATA = rows; byId = {}; DATA.forEach(d => byId[d.id] = d);
  // D1에 lat/lng가 저장돼 있으면 주소 변환 없이 바로 사용
  DATA.forEach(d => { if (d.lat != null && d.lng != null && !geo[gk(d)]) geo[gk(d)] = { lat:+d.lat, lng:+d.lng }; });
}
async function boot(){
  loadError = false;
  $("count").textContent = "맛집 불러오는 중…";
  try {
    // 수정 내용이 바로 보이도록 매번 새로 요청합니다
    const r = await fetch(API_URL + (API_URL.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache:"no-store" });
    const txt = await r.text();
    if (!r.ok) throw new Error("HTTP " + r.status + " " + txt.slice(0, 160));
    let rows;
    try { rows = JSON.parse(txt); } catch(_) { throw new Error("데이터가 아닌 응답을 받았어요: " + txt.slice(0, 60).replace(/\s+/g, " ")); }
    if (!Array.isArray(rows)) throw new Error("예상과 다른 응답: " + txt.slice(0, 160));
    setData(rows);
    $("stale").hidden = true;
    try { localStorage.setItem(DATA_CACHE, JSON.stringify(rows)); } catch(e){}
  } catch(e){
    console.warn("맛집 데이터를 불러오지 못했습니다:", e);
    try { const c = JSON.parse(localStorage.getItem(DATA_CACHE) || "null"); if (Array.isArray(c) && c.length){
      setData(c);
      $("stale").hidden = false;
      $("stale").textContent = "최신 맛집 정보를 불러오지 못해 이전에 저장된 목록을 보여드리고 있어요. (" + String((e && e.message) || e).slice(0, 120) + ")";
    } } catch(_){}
    if (!DATA.length){
      loadError = true;
      loadErrorMsg = String((e && e.message) || e);
      if (/Failed to fetch|NetworkError|Load failed/i.test(loadErrorMsg)) loadErrorMsg += " (API 주소가 틀렸거나 접속 허용 설정 문제일 수 있어요)";
    }
  }
  renderFilters(); renderList();
  if (map) syncMap(true); else loadKakao();
}
/* ---------- 맛집 추천하기 ---------- */
const dlg = $("suggest-dlg"), sgForm = $("sg-form");
$("sg-cats").innerHTML = CATS.map(c => `<label class="opt"><input type="checkbox" name="cat" value="${c}"><span>${c}</span></label>`).join("");
function openSuggest(){
  $("sg-form-wrap").hidden = false; $("sg-done").hidden = true; $("sg-msg").textContent = "";
  dlg.showModal(); $("sg-by").focus();
}
$("suggest-open").addEventListener("click", openSuggest);
$("sg-close").addEventListener("click", () => dlg.close());
$("sg-done-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });  // 바깥을 누르면 닫기
sgForm.addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("sg-msg"), btn = $("sg-submit");
  msg.textContent = "";
  if (!sgForm.reportValidity()) return;
  const v = id => $(id).value.trim();
  const payload = {
    recommender: v("sg-by"), name: v("sg-name"), address: v("sg-addr"), menu: v("sg-menu"),
    story: v("sg-story"), tip: v("sg-tip"), etc: v("sg-etc"), website: v("sg-hp"),
    cats: [...sgForm.querySelectorAll('input[name=cat]:checked')].map(x => x.value),
  };
  btn.disabled = true; btn.textContent = "보내는 중…";
  try {
    const r = await fetch(SUGGEST_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
    sgForm.reset();
    $("sg-form-wrap").hidden = true; $("sg-done").hidden = false;
  } catch(err){
    console.warn("추천 전송 실패:", err);
    msg.textContent = "전송하지 못했어요. 잠시 후 다시 시도해 주세요. (" + (err.message || err) + ")";
  } finally { btn.disabled = false; btn.textContent = "추천하기"; }
});

boot();
</script>
