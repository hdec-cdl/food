<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H-슐랭 | 현대건설 임직원 전국 맛집 지도</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SheetJS Library (Excel Reader) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Inter', 'sans-serif'],
          },
          colors: {
            hdec: {
              green: '#008542',
              greenDark: '#006633',
              greenLight: '#E8F5E9',
              navy: '#002B49',
              navyDark: '#001A2C',
              accent: '#F39200',
              grayBg: '#F8FAFC',
              cardBg: '#FFFFFF',
              border: '#E2E8F0',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
    
    /* Leaflet marker customization */
    .custom-marker-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #008542;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(0, 43, 73, 0.35);
      border: 2.5px solid #FFFFFF;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      cursor: pointer;
    }
    .custom-marker-pin:hover, .custom-marker-pin.active {
      transform: scale(1.22) translateY(-4px);
      background: #002B49;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      border-color: #F39200;
      z-index: 1000 !important;
    }
    
    /* Animation */
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-modal {
      animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-hdec-grayBg text-slate-800 font-sans antialiased overflow-hidden h-screen flex flex-col">

  <!-- Top Navigation Header -->
  <header class="bg-hdec-navy text-white px-4 md:px-6 py-3 shrink-0 flex items-center justify-between shadow-md z-30">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="resetAllFilters()">
      <div class="w-9 h-9 rounded-xl bg-hdec-green flex items-center justify-center text-white shadow-inner font-black text-lg">
        H
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <span class="font-extrabold text-lg md:text-xl tracking-tight text-white">H-슐랭</span>
          <span class="text-[11px] font-semibold bg-hdec-green px-2 py-0.5 rounded-full text-white tracking-wide">현대건설 맛있을지도</span>
        </div>
        <p class="text-xs text-slate-300 hidden sm:block">전국 현장과 본사 임직원이 직접 발로 뛰어 검증한 진짜 맛집</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <!-- Excel File Reader Button -->
      <label class="cursor-pointer flex items-center space-x-1.5 bg-slate-700/80 hover:bg-slate-600 text-white text-xs font-semibold px-3 py-2 rounded-lg border border-slate-500/50 shadow-sm transition">
        <i class="ph ph-file-xls text-emerald-400 text-base"></i>
        <span class="hidden md:inline">엑셀(.xlsx) 파일 열기</span>
        <span class="md:hidden">엑셀 로드</span>
        <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
      </label>

      <!-- Reset Filter Button -->
      <button onclick="resetAllFilters()" title="필터 초기화" class="p-2 rounded-lg bg-slate-700/80 hover:bg-slate-600 text-slate-200 transition">
        <i class="ph ph-arrows-counter-clockwise text-base"></i>
      </button>

      <!-- View Toggle for Mobile -->
      <div class="md:hidden flex bg-slate-800 rounded-lg p-0.5 border border-slate-700">
        <button id="btn-show-list" onclick="setMobileView('list')" class="px-2.5 py-1 text-xs font-bold rounded-md bg-hdec-green text-white">목록</button>
        <button id="btn-show-map" onclick="setMobileView('map')" class="px-2.5 py-1 text-xs font-bold rounded-md text-slate-300">지도</button>
      </div>
    </div>
  </header>

  <!-- Main App Body: Sidebar List + Interactive Map -->
  <main class="flex-1 flex overflow-hidden relative">
    
    <!-- Left Panel: Search, Filter & Restaurant Cards -->
    <section id="sidebar-panel" class="w-full md:w-[440px] lg:w-[480px] bg-white border-r border-hdec-border flex flex-col shrink-0 z-10 transition-transform duration-300">
      
      <!-- Search & Filters Container -->
      <div class="p-3.5 md:p-4 border-b border-hdec-border space-y-3 bg-slate-50/70">
        
        <!-- Search Bar -->
        <div class="relative">
          <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
          <input 
            type="text" 
            id="search-input" 
            oninput="handleSearch(this.value)"
            placeholder="식당명, 대표메뉴, 주소, 추천내용 검색..." 
            class="w-full pl-10 pr-9 py-2.5 text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-hdec-green focus:border-transparent shadow-sm"
          >
          <button id="search-clear-btn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i class="ph ph-x-circle-fill text-lg"></i>
          </button>
        </div>

        <!-- Region & Category Dropdown Selectors -->
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">권역별 선택</label>
            <select id="region-select" onchange="filterByRegion(this.value)" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-2 font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-hdec-green">
              <option value="all">전국 전체 (전체보기)</option>
              <option value="서울">서울 (본사/계동/마곡 등)</option>
              <option value="경기">경기·인천</option>
              <option value="충청">충청·대전·세종</option>
              <option value="강원">강원권</option>
              <option value="경상">경상·대구·부산·울산</option>
              <option value="전라">전라·광주</option>
              <option value="제주">제주도</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">음식 종류</label>
            <select id="category-select" onchange="filterByCategory(this.value)" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-2 font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-hdec-green">
              <option value="all">음식 전체</option>
              <option value="한식">한식 / 백반 / 탕</option>
              <option value="고기·구이">고기구이 / 회식</option>
              <option value="해산물">해산물 / 횟집</option>
              <option value="면류·분식">면류 / 분식</option>
              <option value="중식·일식·양식">중식 / 일식 / 양식</option>
              <option value="카페·디저트">카페 / 디저트</option>
            </select>
          </div>
        </div>

        <!-- Quick Theme Chips -->
        <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
          <button onclick="filterByTag('all')" class="theme-tag-btn px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap bg-hdec-navy text-white transition shadow-xs" data-tag="all">전체</button>
          <button onclick="filterByTag('든든한_현장점심')" class="theme-tag-btn px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition shadow-xs" data-tag="든든한_현장점심">#든든한_현장점심</button>
          <button onclick="filterByTag('회식_소주한잔')" class="theme-tag-btn px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition shadow-xs" data-tag="회식_소주한잔">#회식_소주한잔</button>
          <button onclick="filterByTag('소장님_단골노포')" class="theme-tag-btn px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition shadow-xs" data-tag="소장님_단골노포">#소장님_단골노포</button>
          <button onclick="filterByTag('출장길_혼밥')" class="theme-tag-btn px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition shadow-xs" data-tag="출장길_혼밥">#출장길_혼밥</button>
          <button onclick="filterByTag('의전_정갈한접대')" class="theme-tag-btn px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition shadow-xs" data-tag="의전_정갈한접대">#의전_정갈한접대</button>
        </div>

        <!-- Result Status & Sorting Bar -->
        <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
          <div>
            <span>총 <strong id="restaurant-count" class="text-hdec-green font-bold text-sm">0</strong>개의 식당</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-[11px] text-slate-400">정렬:</span>
            <button onclick="setSortMode('likes')" id="sort-likes" class="font-bold text-hdec-green hover:underline">추천순</button>
            <span class="text-slate-300">|</span>
            <button onclick="setSortMode('name')" id="sort-name" class="font-medium text-slate-500 hover:text-slate-800">이름순</button>
          </div>
        </div>

      </div>

      <!-- Restaurant Card List Container -->
      <div id="restaurant-list" class="flex-1 overflow-y-auto p-3 space-y-3 divide-y divide-slate-100">
        <!-- Rendered dynamically by JavaScript -->
      </div>
    </section>

    <!-- Right Panel: Interactive Map -->
    <section id="map-panel" class="flex-1 h-full relative">
      <!-- Leaflet Map Container -->
      <div id="map" class="w-full h-full z-0 bg-slate-100"></div>

      <!-- Floating Map Controls -->
      <div class="absolute top-4 right-4 z-10 flex flex-col space-y-2">
        <button onclick="resetMapView()" title="전국 지도 전체보기" class="bg-white hover:bg-slate-50 text-slate-700 p-2.5 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center transition">
          <i class="ph ph-map-trifold text-lg text-hdec-navy"></i>
        </button>
        <button onclick="locateUserPosition()" title="내 위치 중심으로 이동" class="bg-white hover:bg-slate-50 text-slate-700 p-2.5 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center transition">
          <i class="ph ph-crosshair-simple text-lg text-hdec-green"></i>
        </button>
      </div>

      <!-- Quick Legend Badge on Map -->
      <div class="absolute bottom-6 left-6 z-10 hidden sm:flex items-center space-x-2 bg-white/95 backdrop-blur-md px-3.5 py-2 rounded-xl shadow-md border border-slate-200 text-xs font-semibold text-slate-700">
        <span class="w-2.5 h-2.5 rounded-full bg-hdec-green"></span>
        <span>현대건설 임직원 인증 단골 맛집</span>
      </div>
    </section>

  </main>

  <!-- Restaurant Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-3 sm:p-4 hidden" onclick="handleBackdropClick(event)">
    <div id="detail-modal-card" class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh] animate-modal" onclick="event.stopPropagation()">
      
      <!-- Modal Header -->
      <div class="bg-hdec-navy text-white px-5 py-4 flex items-start justify-between">
        <div>
          <div class="flex items-center space-x-2 mb-1">
            <span id="modal-category" class="bg-hdec-green text-white text-[11px] font-bold px-2 py-0.5 rounded-md">한식</span>
            <span id="modal-tag" class="text-xs text-emerald-300 font-semibold">#든든한_현장점심</span>
          </div>
          <h3 id="modal-name" class="text-xl font-extrabold text-white tracking-tight">식당 이름</h3>
        </div>
        <button onclick="closeDetailModal()" class="text-slate-300 hover:text-white p-1 rounded-lg hover:bg-slate-700 transition">
          <i class="ph ph-x text-xl font-bold"></i>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="p-5 space-y-4 overflow-y-auto">
        
        <!-- Comment Box (Full text without summary) -->
        <div class="bg-emerald-50/70 border border-emerald-100 rounded-xl p-4">
          <div class="flex items-center space-x-1.5 text-hdec-green font-bold text-xs mb-2">
            <i class="ph ph-quotes text-base"></i>

          <div class="mt-3 text-right">
            <span id="modal-recommender" class="text-xs text-slate-500 font-semibold bg-white/80 px-2 py-0.5 rounded border border-emerald-200">
              추천인: 임직원
            </span>
          </div>
        </div>

        <!-- Menu Details -->
        <div class="space-y-1.5">
          <h4 class="text-xs font-bold text-slate-500 flex items-center space-x-1">
            <i class="ph ph-fork-knife text-hdec-green text-sm"></i>
            <span>[대표 메뉴]</span>
          </h4>
          <p id="modal-menu" class="text-sm font-semibold text-slate-800 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
            메뉴 정보
          </p>
        </div>

        <!-- Tip Details -->
        <div class="space-y-1.5">
          <h4 class="text-xs font-bold text-slate-500 flex items-center space-x-1">
            <i class="ph ph-lightbulb text-amber-500 text-sm"></i>
            <span>[방문 꿀팁 / 주차 정보]</span>
          </h4>
          <p id="modal-tip" class="text-xs font-medium text-slate-700 bg-amber-50/60 p-2.5 rounded-lg border border-amber-200/80 leading-relaxed">
            방문 팁 정보
          </p>
        </div>

        <!-- Address & Copy -->
        <div class="space-y-1.5">
          <h4 class="text-xs font-bold text-slate-500 flex items-center space-x-1">
            <i class="ph ph-map-pin text-rose-500 text-sm"></i>
            <span>[식당 위치]</span>
          </h4>
          <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs">
            <span id="modal-address" class="text-slate-700 font-medium truncate mr-2">주소 정보</span>
            <button onclick="copyModalAddress()" class="shrink-0 text-xs font-semibold bg-white hover:bg-slate-100 text-slate-700 px-2.5 py-1 rounded border border-slate-300 flex items-center space-x-1 transition shadow-xs">
              <i class="ph ph-copy"></i>
              <span>복사</span>
            </button>
          </div>
        </div>

      </div>

      <!-- Modal Footer: Navigation Links & Like Button -->
      <div class="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-2">
        <!-- Like Counter -->
        <button id="modal-like-btn" onclick="handleModalLikeClick()" class="flex items-center space-x-1.5 px-3 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:border-rose-300 hover:text-rose-600 transition shadow-xs">
          <i id="modal-like-icon" class="ph ph-heart text-base text-rose-500"></i>
          <span id="modal-like-count" class="text-xs font-bold">0</span>
        </button>

        <!-- Navigation Buttons -->
        <div class="flex items-center space-x-2 flex-1 justify-end">
          <a id="modal-link-naver" href="#" target="_blank" class="flex-1 max-w-[130px] text-center text-xs font-bold py-2 px-3 rounded-xl bg-[#03C75A] text-white hover:bg-[#02b350] transition shadow-xs flex items-center justify-center space-x-1">
            <span>네이버 지도</span>
            <i class="ph ph-arrow-square-out text-sm"></i>
          </a>
          <a id="modal-link-kakao" href="#" target="_blank" class="flex-1 max-w-[130px] text-center text-xs font-bold py-2 px-3 rounded-xl bg-[#FEE500] text-[#191919] hover:bg-[#ebd300] transition shadow-xs flex items-center justify-center space-x-1">
            <span>카카오맵</span>
            <i class="ph ph-arrow-square-out text-sm"></i>
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg z-50 opacity-0 pointer-events-none transition-opacity duration-200">
    알림 메시지

    // Global App State
    let allRestaurants = [...INITIAL_RESTAURANTS];
    let filteredRestaurants = [...INITIAL_RESTAURANTS];
    let map = null;
    let markersLayer = null;
    let activeMarkerId = null;

    let searchKeyword = "";
    let selectedRegion = "all";
    let selectedCategory = "all";
    let selectedTag = "all";
    let sortMode = "likes"; // 'likes' or 'name'

    let modalCurrentRestaurant = null;

    // Initialize Map with fallback check
    function initMap() {
      if (typeof L === 'undefined') {
        console.warn("Leaflet library not ready yet, retrying...");
        setTimeout(initMap, 150);
        return;
      }
      if (map) return;

      map = L.map('map', {
        zoomControl: false
      }).setView([36.3, 127.8], 7);

      // CartoDB Voyager tiles (Clean, modern aesthetic)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors & CartoDB',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);

      // Render dataset onto list and map
      applyFilters();
    }

    function applyFilters() {
      filteredRestaurants = allRestaurants.filter(item => {
        // Keyword Search
        if (searchKeyword.trim() !== "") {
          const kw = searchKeyword.toLowerCase();
          const matchName = item.name.toLowerCase().includes(kw);
          const matchMenu = item.menu.toLowerCase().includes(kw);
          const matchAddress = item.address.toLowerCase().includes(kw);
          const matchComment = item.comment.toLowerCase().includes(kw);
          const matchRecommender = item.recommender.toLowerCase().includes(kw);
          if (!matchName && !matchMenu && !matchAddress && !matchComment && !matchRecommender) {
            return false;
          }
        }

        // Region Filter
        if (selectedRegion !== "all" && item.region !== selectedRegion) {
          return false;
        }

        // Category Filter
        if (selectedCategory !== "all" && item.category !== selectedCategory) {
          return false;
        }

        // Tag Filter
        if (selectedTag !== "all" && item.tag !== selectedTag) {
          return false;
        }

        return true;
      });

      // Sort
      if (sortMode === 'likes') {
        filteredRestaurants.sort((a, b) => b.likes - a.likes || a.name.localeCompare(b.name, 'ko'));
      } else {
        filteredRestaurants.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
      }

      renderList();
      renderMarkers();
    }

    // Render Left Restaurant Card List
    function renderList() {
      const container = document.getElementById('restaurant-list');
      const countEl = document.getElementById('restaurant-count');
      countEl.innerText = filteredRestaurants.length;

      if (filteredRestaurants.length === 0) {
        container.innerHTML = `
          <div class="py-16 text-center text-slate-400">
            <i class="ph ph-magnifying-glass text-4xl mb-2 block text-slate-300"></i>
            <p class="font-medium text-sm">조건에 맞는 맛집이 없습니다.</p>
            <button onclick="resetAllFilters()" class="mt-3 text-xs text-hdec-green font-bold hover:underline">
              필터 초기화
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredRestaurants.map(item => {
        return `
          <div 
            id="card-${item.id}"
            onclick="selectRestaurant(${item.id})"
            class="p-4 rounded-xl bg-white border border-slate-200 hover:border-hdec-green hover:shadow-md transition-all cursor-pointer group space-y-2.5"
          >
            <!-- Card Top: Category, Theme, Like Heart Button -->
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-hdec-navy">${item.category}</span>
                <span class="text-slate-300 text-xs">•</span>
                <span class="text-xs font-semibold text-hdec-green">#${item.tag}</span>
              </div>
              <!-- Heart Like Toggle Button -->
              <button 
                onclick="toggleLike(event, ${item.id})" 
                class="flex items-center space-x-1 text-xs font-bold px-2 py-0.5 rounded-full transition ${item.likes > 0 ? 'bg-rose-50 text-rose-600' : 'bg-slate-100 text-slate-400 hover:text-rose-500'}"
              >
                <i class="ph ${item.likes > 0 ? 'ph-heart-fill' : 'ph-heart'} text-sm text-rose-500"></i>
                <span>${item.likes}</span>
              </button>
            </div>

            <!-- Card Title: Restaurant Name -->
            <h4 class="text-base font-extrabold text-slate-900 group-hover:text-hdec-green transition">
              ${item.name}
            </h4>

            <!-- Recommended Menu -->
            <div class="text-xs text-slate-600 flex items-start space-x-1.5 bg-slate-50 p-2 rounded-lg">
              <span class="font-bold text-slate-700 shrink-0">[대표 메뉴]</span>
              <span class="truncate font-medium text-slate-800">${item.menu}</span>
            </div>

            <!-- Unedited Full Comment -->
            <div class="text-xs text-slate-700 leading-relaxed font-normal bg-emerald-50/50 p-2.5 rounded-lg border border-emerald-100/70">
              <p class="whitespace-pre-line text-slate-800">
                💬 "${item.comment}"
              </p>
            </div>

            <!-- Card Bottom: Detail & Navigation Button -->
            <div class="flex items-center justify-end pt-1">
              <span class="text-[11px] font-bold text-hdec-green flex items-center space-x-0.5 group-hover:translate-x-0.5 transition-transform">
                <span>상세보기 & 길찾기</span>
                <i class="ph ph-arrow-right"></i>
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Render Leaflet Markers
    function renderMarkers() {
      if (!markersLayer || !map) return;
      markersLayer.clearLayers();

      const bounds = [];

      filteredRestaurants.forEach(item => {
        if (!item.lat || !item.lng) return;

        bounds.push([item.lat, item.lng]);

        // Pick category icon
        let iconName = 'ph-fork-knife';
        if (item.category === '해산물') iconName = 'ph-fish-simple';
        else if (item.category === '고기·구이') iconName = 'ph-fire';
        else if (item.category === '카페·디저트') iconName = 'ph-coffee';
        else if (item.category === '면류·분식') iconName = 'ph-bowl-food';

        const customIcon = L.divIcon({
          className: 'custom-leaflet-pin-wrapper',
          html: `
            <div id="marker-pin-${item.id}" class="custom-marker-pin ${activeMarkerId === item.id ? 'active' : ''}">
              <i class="ph ${iconName} text-base"></i>
            </div>
          `,
          iconSize: [38, 38],
          iconAnchor: [19, 19]
        });

        const marker = L.marker([item.lat, item.lng], { icon: customIcon });

        marker.on('click', () => {
          selectRestaurant(item.id, false);
        });

        markersLayer.addLayer(marker);
      });

      // Fit map bounds if results exist
      if (bounds.length > 0 && selectedRegion !== 'all') {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 13 });
      }
    }

    // Select restaurant from Card or Marker
    function selectRestaurant(id, shouldPan = true) {
      const item = allRestaurants.find(r => r.id === id);
      if (!item) return;

      activeMarkerId = id;

      // Highlight active marker style
      document.querySelectorAll('.custom-marker-pin').forEach(pin => pin.classList.remove('active'));
      const activePin = document.getElementById(`marker-pin-${id}`);
      if (activePin) activePin.classList.add('active');

      // Scroll list card into view
      const card = document.getElementById(`card-${id}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        card.classList.add('ring-2', 'ring-hdec-green');
        setTimeout(() => card.classList.remove('ring-2', 'ring-hdec-green'), 1800);
      }

      // Fly to marker on map
      if (map && item.lat && item.lng) {
        map.flyTo([item.lat, item.lng], 14, {
          duration: 1.0
        });
      }

      // Open Modal Card
      openDetailModal(item);
    }

    // Open Detail Modal with complete fields
    function openDetailModal(item) {
      modalCurrentRestaurant = item;

      document.getElementById('modal-name').innerText = item.name;
      document.getElementById('modal-category').innerText = item.category;
      document.getElementById('modal-tag').innerText = `#${item.tag}`;
      document.getElementById('modal-comment').innerText = `"${item.comment}"`;
      document.getElementById('modal-recommender').innerText = `추천인: ${item.recommender || '현대건설 사우'}`;
      document.getElementById('modal-menu').innerText = item.menu;
      document.getElementById('modal-tip').innerText = item.tip || "방문 전 영업시간 확인을 권장합니다.";
      document.getElementById('modal-address').innerText = item.address;

      // Like count & icon in modal
      updateModalLikeUI();

      // Navigation Link URLs
      const encodedQuery = encodeURIComponent(item.name);
      document.getElementById('modal-link-naver').href = `https://map.naver.com/v5/search/${encodedQuery}`;
      document.getElementById('modal-link-kakao').href = `https://map.kakao.com/link/search/${encodedQuery}`;

      // Show Modal
      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      modalCurrentRestaurant = null;
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'detail-modal') {
        closeDetailModal();
      }
    }

    // Like Click Handler in Modal
    function handleModalLikeClick() {
      if (!modalCurrentRestaurant) return;
      modalCurrentRestaurant.likes = (modalCurrentRestaurant.likes || 0) + 1;
      updateModalLikeUI();
      renderList();
      showToast(`'${modalCurrentRestaurant.name}'을(를) 추천했습니다! (+1)`);
    }

    function updateModalLikeUI() {
      if (!modalCurrentRestaurant) return;
      document.getElementById('modal-like-count').innerText = modalCurrentRestaurant.likes;
      const icon = document.getElementById('modal-like-icon');
      if (modalCurrentRestaurant.likes > 0) {
        icon.className = 'ph ph-heart-fill text-base text-rose-500';
      } else {
        icon.className = 'ph ph-heart text-base text-rose-500';
      }
    }

    // Toggle like on card
    function toggleLike(e, id) {
      e.stopPropagation();
      const item = allRestaurants.find(r => r.id === id);
      if (!item) return;

      item.likes = (item.likes || 0) + 1;
      renderList();
      showToast(`'${item.name}'을(를) 추천했습니다! (+1)`);
    }

    // Search and Filters
    function handleSearch(val) {
      searchKeyword = val;
      const clearBtn = document.getElementById('search-clear-btn');
      if (val.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      applyFilters();
    }

    function clearSearch() {
      document.getElementById('search-input').value = "";
      searchKeyword = "";
      document.getElementById('search-clear-btn').classList.add('hidden');
      applyFilters();
    }

    function filterByRegion(val) {
      selectedRegion = val;
      applyFilters();
    }

    function filterByCategory(val) {
      selectedCategory = val;
      applyFilters();
    }

    function filterByTag(tag) {
      selectedTag = tag;
      document.querySelectorAll('.theme-tag-btn').forEach(btn => {
        if (btn.getAttribute('data-tag') === tag) {
          btn.className = 'theme-tag-btn px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap bg-hdec-navy text-white transition shadow-xs';
        } else {
          btn.className = 'theme-tag-btn px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition shadow-xs';
        }
      });
      applyFilters();
    }

    function setSortMode(mode) {
      sortMode = mode;
      const btnLikes = document.getElementById('sort-likes');
      const btnName = document.getElementById('sort-name');

      if (mode === 'likes') {
        btnLikes.className = 'font-bold text-hdec-green hover:underline';
        btnName.className = 'font-medium text-slate-500 hover:text-slate-800';
      } else {
        btnName.className = 'font-bold text-hdec-green hover:underline';
        btnLikes.className = 'font-medium text-slate-500 hover:text-slate-800';
      }
      applyFilters();
    }

    function resetAllFilters() {
      searchKeyword = "";
      selectedRegion = "all";
      selectedCategory = "all";
      selectedTag = "all";
      sortMode = "likes";

      document.getElementById('search-input').value = "";
      document.getElementById('search-clear-btn').classList.add('hidden');
      document.getElementById('region-select').value = "all";
      document.getElementById('category-select').value = "all";

      document.querySelectorAll('.theme-tag-btn').forEach(btn => {
        if (btn.getAttribute('data-tag') === 'all') {
          btn.className = 'theme-tag-btn px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap bg-hdec-navy text-white transition shadow-xs';
        } else {
          btn.className = 'theme-tag-btn px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition shadow-xs';
        }
      });

      setSortMode('likes');
      resetMapView();
    }

    function resetMapView() {
      if (map) {
        map.setView([36.3, 127.8], 7);
      }
    }

    function locateUserPosition() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude, longitude } = pos.coords;
          if (map) {
            map.flyTo([latitude, longitude], 13);
            showToast("현재 내 위치 중심으로 지도를 이동했습니다.");
          }
        }, () => {
          showToast("위치 권한을 확인할 수 없습니다.");
        });
      } else {
        showToast("브라우저에서 위치 서비스를 지원하지 않습니다.");
      }
    }

    function copyModalAddress() {
      const addr = document.getElementById('modal-address').innerText;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(addr).then(() => {
          showToast("주소가 클립보드에 복사되었습니다!");
        });
      } else {
        const temp = document.createElement('textarea');
        temp.value = addr;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast("주소가 클립보드에 복사되었습니다!");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2300);
    }

    // Direct Excel (.xlsx) File Upload & Live Parsing
    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });

          if (!json || json.length === 0) {
            showToast("엑셀 파일에 데이터가 없습니다.");
            return;
          }

          // Parse rows into our app data format
          const imported = json.map((row, idx) => {
            const keys = Object.keys(row);
            
            // Flexible column detector
            const findVal = (terms) => {
              const matchedKey = keys.find(k => terms.some(t => k.includes(t)));
              return matchedKey ? String(row[matchedKey]).trim() : "";
            };

            const name = findVal(['식당', '상호', '이름', '음식점']) || `식당 #${idx + 1}`;
            const address = findVal(['주소', '위치', '소재지']) || "대한민국";
            const menu = findVal(['메뉴', '대표', '음식']) || "시그니처 메뉴";
            const comment = findVal(['이유', '추천', '코멘트', '설명', '사유']) || "임직원 추천 맛집입니다.";
            const recommender = findVal(['추천인', '사우', '작성자', '이름']) || "임직원";
            const tip = findVal(['팁', '꿀팁', '주차', '비고']) || "방문 전 전화 확인 권장";

            // Infer region from address
            let region = "서울";
            if (address.includes('경기') || address.includes('인천')) region = "경기";
            else if (address.includes('충남') || address.includes('충북') || address.includes('대전') || address.includes('세종')) region = "충청";
            else if (address.includes('강원')) region = "강원";
            else if (address.includes('경북') || address.includes('경남') || address.includes('부산') || address.includes('대구') || address.includes('울산')) region = "경상";
            else if (address.includes('전남') || address.includes('전북') || address.includes('광주')) region = "전라";
            else if (address.includes('제주')) region = "제주";

            // Category guessing
            let category = "한식";
            if (menu.includes('회') || menu.includes('생선') || menu.includes('장어') || menu.includes('해산물')) category = "해산물";
            else if (menu.includes('고기') || menu.includes('갈비') || menu.includes('삼겹') || menu.includes('한우')) category = "고기·구이";
            else if (menu.includes('면') || menu.includes('국수') || menu.includes('냉면') || menu.includes('떡볶이')) category = "면류·분식";
            else if (menu.includes('커피') || menu.includes('카페') || menu.includes('디저트')) category = "카페·디저트";
            else if (menu.includes('짬뽕') || menu.includes('파스타') || menu.includes('카츠') || menu.includes('스테이크')) category = "중식·일식·양식";

            // Geocode approximate center per region if lat/lng missing
            const regionCoordinates = {
              "서울": { lat: 37.5665, lng: 126.9780 },
              "경기": { lat: 37.4138, lng: 127.5183 },
              "충청": { lat: 36.6358, lng: 127.4914 },
              "강원": { lat: 37.8228, lng: 128.1555 },
              "경상": { lat: 35.8714, lng: 128.6014 },
              "전라": { lat: 35.1595, lng: 126.8526 },
              "제주": { lat: 33.4996, lng: 126.5312 }
            };

            const baseCoord = regionCoordinates[region] || regionCoordinates["서울"];
            const jitterLat = (Math.random() - 0.5) * 0.08;
            const jitterLng = (Math.random() - 0.5) * 0.08;

            return {
              id: 1000 + idx,
              name,
              category,
              region,
              address,
              lat: baseCoord.lat + jitterLat,
              lng: baseCoord.lng + jitterLng,
              menu,
              comment,
              tip,
              tag: "든든한_현장점심",
              recommender,
              likes: 0
            };
          });

          allRestaurants = imported;
          resetAllFilters();
          showToast(`엑셀에서 ${imported.length}개 맛집을 성공적으로 불러왔습니다!`);
        } catch (err) {
          console.error(err);
          showToast("엑셀 파일 로드 중 오류가 발생했습니다.");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // Mobile View Toggle
    function setMobileView(view) {
      const sidebar = document.getElementById('sidebar-panel');
      const btnList = document.getElementById('btn-show-list');
      const btnMap = document.getElementById('btn-show-map');

      if (view === 'list') {
        sidebar.classList.remove('hidden');
        sidebar.classList.add('w-full');
        btnList.className = 'px-2.5 py-1 text-xs font-bold rounded-md bg-hdec-green text-white';
        btnMap.className = 'px-2.5 py-1 text-xs font-bold rounded-md text-slate-300';
      } else {
        sidebar.classList.add('hidden');
        btnMap.className = 'px-2.5 py-1 text-xs font-bold rounded-md bg-hdec-green text-white';
        btnList.className = 'px-2.5 py-1 text-xs font-bold rounded-md text-slate-300';
        if (map) map.invalidateSize();
      }
    }

    // Launch app safely on window load
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
    });
  </script>
</body>
